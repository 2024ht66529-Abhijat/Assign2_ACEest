<!DOCTYPE html>
<html>
<head>
    <title>ACEest Dashboard</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: sans-serif; display: flex; flex-direction: column; }
        .header { background: var(--gold); color: black; padding: 20px; font-weight: bold; text-align: center; }
        .main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }
        .panel { border: 1px solid var(--gold); padding: 15px; background: #222; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; }
        .console { background: #000; color: #0f0; padding: 15px; font-family: monospace; min-height: 200px; white-space: pre; }
    </style>
</head>
<body>
    <div class="header">ACEest Fitness Dashboard ({{ role }})</div>
    <div class="main">
        <div class="panel">
            <h3>Management</h3>
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="weight" placeholder="Weight">
            <select id="program">{% for p in programs %}<option>{{ p }}</option>{% endfor %}</select>
            <input type="date" id="membership">
            <button onclick="saveClient()">Save Client</button>
            <button onclick="generateAI()">Generate AI Program</button>
            <button onclick="window.location.href='/export_pdf/'+document.getElementById('name').value">Export PDF</button>
        </div>
        <div class="panel">
            <div id="summary" class="console">Select client to view summary...</div>
            <table id="progTable" style="width:100%; margin-top:20px; border:1px solid var(--gold)">
                <thead><tr><th>Day</th><th>Ex</th><th>Sets</th><th>Reps</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        async function saveClient() {
            const data = { name: document.getElementById('name').value, weight: document.getElementById('weight').value, program: document.getElementById('program').value, membership: document.getElementById('membership').value, age: 25, height: 175 };
            const res = await fetch('/save_client', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            const result = await res.json();
            document.getElementById('summary').innerText = `Saved! Calories: ${result.calories}`;
        }
        async function generateAI() {
            const level = prompt("Enter experience (beginner/intermediate/advanced):");
            const res = await fetch('/generate_ai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: document.getElementById('name').value, level})});
            const data = await res.json();
            const tbody = document.querySelector("#progTable tbody");
            tbody.innerHTML = data.map(r => `<tr><td>${r.day}</td><td>${r.exercise}</td><td>${r.sets}</td><td>${r.reps}</td></tr>`).join('');
        }
    </script>
</body>
</html>
