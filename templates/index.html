<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness & Performance</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --panel: #262626; }
        body { background: var(--dark); color: white; font-family: 'Helvetica', sans-serif; margin: 0; }
        .header { background: var(--gold); color: black; padding: 20px; text-align: center; font-weight: bold; }
        .main { display: grid; grid-template-columns: 350px 1fr; gap: 20px; padding: 20px; }
        .panel { background: var(--panel); border: 1px solid var(--gold); padding: 15px; border-radius: 4px; }
        input, select { width: 95%; padding: 8px; margin: 8px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; }
        .tab-content { display: none; background: #000; padding: 20px; min-height: 400px; color: #0f0; font-family: monospace; }
        .active { display: block; }
    </style>
</head>
<body>
    <div class="header">ACEest FUNCTIONAL FITNESS SYSTEM</div>
    <div class="main">
        <div class="left panel">
            <h3>Client Profile</h3>
            <label>Name</label><input type="text" id="name">
            <label>Weight (kg)</label><input type="number" id="weight">
            <label>Program</label>
            <select id="program">{% for p in programs %}<option>{{p}}</option>{% endfor %}</select>
            <button onclick="saveClient()">SAVE CLIENT</button>
            <button onclick="showHistory()" style="background:#444; color:var(--gold)">VIEW HISTORY</button>
        </div>
        <div class="right">
            <div id="summary" class="tab-content active">Select a client to view summary...</div>
            <div id="history" class="tab-content"></div>
        </div>
    </div>
    <script>
        async function saveClient() {
            const res = await fetch('/save_client', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    weight: document.getElementById('weight').value,
                    program: document.getElementById('program').value
                })
            });
            const data = await res.json();
            document.getElementById('summary').innerText = `Saved! Calories: ${data.calories} kcal/day`;
        }
    </script>
</body>
</html>
