<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness & Performance</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: Arial; margin: 0; }
        .header { background: var(--gold); color: black; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; }
        .main { display: flex; padding: 20px; gap: 20px; }
        .panel { border: 2px solid var(--gold); padding: 15px; background: #222; }
        .left { width: 350px; } .right { flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }
        input, select { width: 100%; padding: 8px; margin: 8px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; background: var(--gold); font-weight: bold; border: none; }
        #summaryBox { background: #111; font-family: 'Consolas', monospace; padding: 15px; white-space: pre; border: 1px solid #444; min-height: 150px; }
        .chart-container { background: #fff; padding: 15px; border-radius: 5px; height: 300px; }
    </style>
</head>
<body>
    <div class="header">ACEest Functional Fitness System</div>
    <div class="main">
        <div class="panel left">
            <h3 style="color:var(--gold)">Client Management</h3>
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="age" placeholder="Age">
            <input type="number" id="weight" placeholder="Weight (kg)">
            <select id="program">
                {% for p in programs %}<option>{{p}}</option>{% endfor %}
            </select>
            <label>Weekly Adherence: <span id="adhVal">0</span>%</label>
            <input type="range" id="adherence" min="0" max="100" value="0" oninput="adhVal.innerText=this.value">
            
            <button onclick="saveClient()">Save Client</button>
            <button onclick="loadClient()">Load Client</button>
            <button onclick="saveProgress()">Save Progress</button>
            <button onclick="showChart()" style="background:#444; color:var(--gold)">View Progress Chart</button>
        </div>

        <div class="right">
            <div class="panel">
                <h3 style="color:var(--gold)">Client Summary</h3>
                <div id="summaryBox">Enter name and click 'Load Client'...</div>
            </div>
            <div class="panel chart-container" id="chartPanel" style="display:none;">
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        async function saveClient() {
            const data = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                weight: document.getElementById('weight').value,
                program: document.getElementById('program').value
            };
            const res = await fetch('/save_client', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }

        async function loadClient() {
            const name = document.getElementById('name').value;
            const res = await fetch(`/load_client/${name}`);
            const data = await res.json();
            if(data.name) {
                document.getElementById('age').value = data.age;
                document.getElementById('weight').value = data.weight;
                document.getElementById('program').value = data.program;
                document.getElementById('summaryBox').innerText = `CLIENT PROFILE\n--------------\nName      : ${data.name}\nAge       : ${data.age}\nWeight    : ${data.weight} kg\nProgram   : ${data.program}\nCalories  : ${data.calories} kcal/day`;
            } else { alert("Client not found"); }
        }

        async function saveProgress() {
            const data = {
                name: document.getElementById('name').value,
                adherence: document.getElementById('adherence').value
            };
            const res = await fetch('/save_progress', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }

        async function showChart() {
            const name = document.getElementById('name').value;
            if(!name) return alert("Enter client name first");
            
            const res = await fetch(`/get_progress/${name}`);
            const data = await res.json();
            
            if(data.length === 0) return alert("No progress data available");

            document.getElementById('chartPanel').style.display = 'block';
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(row => row.week),
                    datasets: [{
                        label: 'Weekly Adherence (%)',
                        data: data.map(row => row.adherence),
                        borderColor: '#d4af37',
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: { scales: { y: { min: 0, max: 100 } }, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
