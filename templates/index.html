<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness & Performance</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --gray: #333; }
        body { background-color: var(--dark); color: white; font-family: 'Helvetica', sans-serif; margin: 0; }
        
        /* Matching your Tkinter Header */
        .header { background-color: var(--gold); color: black; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; }
        
        .main-container { display: flex; padding: 20px; gap: 20px; }
        
        /* Panel Styling (LabelFrame equivalent) */
        .panel { 
            flex: 1; border: 2px solid var(--gold); border-radius: 8px; 
            padding: 15px; background: #222; 
        }
        .panel h2 { color: var(--gold); font-size: 18px; margin-top: 0; border-bottom: 1px solid var(--gold); }

        input, select, button { 
            width: 100%; padding: 10px; margin: 8px 0; 
            background: var(--gray); border: 1px solid var(--gold); color: white; border-radius: 4px;
        }
        button { background: var(--gold); color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b8962d; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border-bottom: 1px solid #444; padding: 10px; text-align: left; }
        th { color: var(--gold); }
    </style>
</head>
<body>

<div class="header">ACEest Functional Fitness System</div>

<div class="main-container">
    <!-- LEFT PANEL: Client Management -->
    <div class="panel">
        <h2>Client Management</h2>
        <form action="/add_client" method="POST">
            <input type="text" name="name" placeholder="Client Name" required>
            <input type="number" name="age" placeholder="Age" required>
            <input type="number" step="0.1" name="weight" placeholder="Weight (kg)" required>
            <select name="program">
                {% for p in programs %} <option value="{{p}}">{{p}}</option> {% endfor %}
            </select>
            <button type="submit">Add Client</button>
        </form>

        <table>
            <thead>
                <tr><th>Name</th><th>Program</th><th>Kcal/Day</th></tr>
            </thead>
            <tbody>
                {% for c in clients %}
                <tr><td>{{c.name}}</td><td>{{c.program}}</td><td>{{c.calories}}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- RIGHT PANEL: Progress Tracking -->
    <div class="panel">
        <h2>Progress & Adherence</h2>
        <form action="/add_progress" method="POST">
            <input type="text" name="client_name" placeholder="Client Name" required>
            <input type="text" name="week" placeholder="Week (e.g. Week 1)" required>
            <input type="number" name="adherence" placeholder="Adherence %" min="0" max="100" required>
            <button type="submit">Log Progress</button>
        </form>

        <table>
            <thead>
                <tr><th>Client</th><th>Week</th><th>Adherence</th></tr>
            </thead>
            <tbody>
                {% for p in progress %}
                <tr><td>{{p.client_name}}</td><td>{{p.week}}</td><td>{{p.adherence}}%</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
