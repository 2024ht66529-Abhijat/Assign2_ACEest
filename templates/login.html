<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness Login</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --gray: #333; }
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Helvetica', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #222;
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 0 15px rgba(212,175,55,0.5);
        }
        .login-container h2 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--gray);
            border: 1px solid var(--gold);
            color: white;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #b8962d;
        }
        .error {
            color: #ff4d4d;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>ACEest Login</h2>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
