<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness v2</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --panel: #222; }
        body { background: var(--dark); color: white; font-family: Arial; margin: 0; }
        .header { background: var(--gold); color: black; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
        .main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; }
        .panel { border: 1px solid var(--gold); padding: 15px; background: var(--panel); margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; font-weight: bold; background: var(--gold); border: none; }
        table { width: 100%; border-collapse: collapse; background: #111; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; font-size: 13px; }
        th { color: var(--gold); }
        .chart-container { background: #fff; padding: 10px; border-radius: 5px; margin-top: 10px; height: 250px; }
    </style>
</head>
<body>
    <div class="header">ACEest FUNCTIONAL FITNESS SYSTEM v2</div>
    <div class="main">
        <div class="left">
            <div class="panel">
                <label>Name</label><input type="text" id="name">
                <label>Age</label><input type="number" id="age">
                <label>Weight (kg)</label><input type="number" id="weight">
                <label>Program</label>
                <select id="program">
                    <option value="">-- Select --</option>
                    {% for p in programs %}<option>{{p}}</option>{% endfor %}
                </select>
                <label>Adherence (%)</label><input type="range" id="adherence" min="0" max="100">
                <label>Coach Notes</label><input type="text" id="notes">
                <button onclick="saveClient()">Save Client</button>
                <button style="background:transparent; color:var(--gold); border:1px solid var(--gold);" onclick="window.location.href='/export_csv'">Export CSV</button>
            </div>
        </div>
        <div class="right">
            <div id="details" class="panel" style="display:none;">
                <h3 id="detTitle" style="color:var(--gold)">Plan Details</h3>
                <p id="detWork"></p><p id="detDiet"></p>
                <h4 id="detKcal" style="color:var(--gold)"></h4>
            </div>
            <div class="panel">
                <table id="clientTable">
                    <thead><tr><th>Name</th><th>Age</th><th>Weight</th><th>Program</th><th>Adh%</th><th>Notes</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="panel">
                <div class="chart-container"><canvas id="progressChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let myChart;
        async function saveClient() {
            const payload = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                weight: document.getElementById('weight').value,
                program: document.getElementById('program').value,
                adherence: document.getElementById('adherence').value,
                notes: document.getElementById('notes').value
            };
            const res = await fetch('/save_client', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            updateUI(data.clients);
        }

        function updateUI(clients) {
            const last = clients[clients.length - 1];
            document.getElementById('details').style.display = 'block';
            document.getElementById('detWork').innerText = "Workout: " + last.workout;
            document.getElementById('detWork').style.color = last.color;
            document.getElementById('detDiet').innerText = "Diet: " + last.diet;
            document.getElementById('detKcal').innerText = `Estimated: ${last.calories} kcal`;

            const tbody = document.querySelector('#clientTable tbody');
            tbody.innerHTML = clients.map(c => `<tr><td>${c.name}</td><td>${c.age}</td><td>${c.weight}</td><td>${c.program}</td><td>${c.adherence}%</td><td>${c.notes}</td></tr>`).join('');
            
            updateChart(clients);
        }

        function updateChart(clients) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: clients.map(c => c.name),
                    datasets: [{ label: 'Adherence %', data: clients.map(c => c.adherence), backgroundColor: '#d4af37' }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
    </script>
</body>
</html>
