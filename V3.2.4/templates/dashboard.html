<!DOCTYPE html>
<html>
<head>
    <title>ACEest Analytics Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --panel: #262626; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; }
        .header { background: var(--gold); color: black; padding: 15px; text-align: center; font-weight: bold; }
        .main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; }
        .panel { border: 1px solid var(--gold); padding: 15px; background: var(--panel); border-radius: 4px; }
        input, select { width: 95%; padding: 8px; margin: 5px 0 12px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 12px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; }
        .chart-box { background: white; padding: 15px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">ACEest PERFORMANCE DASHBOARD ({{ role }}) | <a href="/logout">Logout</a></div>
    <div class="main">
        <div class="panel">
            <h3 style="color:var(--gold)">Management</h3>
            <label>Name</label><input type="text" id="name">
            <label>Weight (kg)</label><input type="number" id="weight">
            <label>Program</label>
            <select id="program">{% for p in programs %}<option>{{p}}</option>{% endfor %}</select>
            <button onclick="saveClient()">SAVE & UPDATE TREND</button>
        </div>
        <div class="panel">
            <h3 style="color:var(--gold)">Weight Performance Trend</h3>
            <div class="chart-box"><canvas id="analyticsChart"></canvas></div>
        </div>
    </div>
    <script>
        let myChart = null;
        async function saveClient() {
            const payload = { name: document.getElementById('name').value, weight: document.getElementById('weight').value, program: document.getElementById('program').value };
            const res = await fetch('/save_client', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            if(data.status === "success") updateChart(payload.name);
        }
        async function updateChart(name) {
            const res = await fetch(`/get_analytics/${encodeURIComponent(name)}`);
            const d = await res.json();
            const ctx = document.getElementById('analyticsChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: d.dates, datasets: [{ label: 'Weight (kg)', data: d.weights, borderColor: '#d4af37', tension: 0.3, fill: true, backgroundColor: 'rgba(212,175,55,0.1)' }]},
                options: { responsive: true }
            });
        }
    </script>
</body>
</html>
