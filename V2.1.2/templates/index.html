<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness & Performance</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: Arial; margin: 0; }
        .header { background: var(--gold); color: black; padding: 20px; text-align: center; font-weight: bold; font-size: 24px; }
        .main { display: flex; padding: 20px; gap: 20px; }
        .panel { border: 2px solid var(--gold); padding: 15px; background: #222; border-radius: 5px; }
        .left { width: 350px; } .right { flex-grow: 1; }
        input, select { width: 100%; padding: 8px; margin: 8px 0; background: #333; color: white; border: 1px solid #555; }
        button { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; background: var(--gold); font-weight: bold; border: none; }
        #summaryBox { background: #111; font-family: 'Consolas', monospace; padding: 20px; white-space: pre; border: 1px solid #444; height: 300px; }
    </style>
</head>
<body>
    <div class="header">ACEest Functional Fitness System</div>
    <div class="main">
        <div class="panel left">
            <h3 style="color:var(--gold)">Client Management</h3>
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="age" placeholder="Age">
            <input type="number" id="weight" placeholder="Weight (kg)">
            <select id="program">
                {% for p in programs %}<option>{{p}}</option>{% endfor %}
            </select>
            <label>Weekly Adherence: <span id="adhLbl">0</span>%</label>
            <input type="range" id="adherence" min="0" max="100" oninput="adhLbl.innerText=this.value">
            
            <button onclick="apiCall('/save_client')">Save Client</button>
            <button onclick="loadClient()">Load Client</button>
            <button onclick="apiCall('/save_progress')">Save Progress</button>
        </div>
        <div class="panel right">
            <h3 style="color:var(--gold)">Client Summary</h3>
            <div id="summaryBox">Load a client to see profile...</div>
        </div>
    </div>

    <script>
        async function apiCall(endpoint) {
            const payload = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                weight: document.getElementById('weight').value,
                program: document.getElementById('program').value,
                adherence: document.getElementById('adherence').value
            };
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message || data.status);
        }

        async function loadClient() {
            const name = document.getElementById('name').value;
            const res = await fetch(`/load_client/${name}`);
            const data = await res.json();
            if(data.id) {
                document.getElementById('age').value = data.age;
                document.getElementById('weight').value = data.weight;
                document.getElementById('program').value = data.program;
                document.getElementById('summaryBox').innerText = `
CLIENT PROFILE\n--------------\nName     : ${data.name}\nAge      : ${data.age}\nWeight   : ${data.weight} kg\nProgram  : ${data.program}\nCalories : ${data.calories} kcal/day`;
            } else { alert("Client not found"); }
        }
    </script>
</body>
</html>
